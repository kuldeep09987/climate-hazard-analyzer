services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
  backend:
    build: ./backend
    environment:
      MONGO_URI: mongodb://mongo:27017
      ALLOWED_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    depends_on: [mongo]
volumes:
  mongo_data:
